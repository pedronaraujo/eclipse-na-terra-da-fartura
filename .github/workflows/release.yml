name: Release module

# Publishes module.json + module.zip as a GitHub release whenever module.json
# lands on main with a new version (or when run manually / on a version tag).
on:
  push:
    branches: [main]
    paths: ['module.json']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: meta
        run: echo "version=$(jq -r .version module.json)" >> "$GITHUB_OUTPUT"
      - name: Check if release exists
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.meta.outputs.version }}" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package
        if: steps.exists.outputs.skip == 'false'
        run: zip -qr module.zip module.json README.md LICENSE assets lang packs scripts styles templates
      - name: Publish release
        if: steps.exists.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Eclipse na Terra da Fartura v${{ steps.meta.outputs.version }}
          files: |
            module.json
            module.zip
          make_latest: true
